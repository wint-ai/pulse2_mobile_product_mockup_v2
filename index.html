<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse2_mobile_product_mockup_v2/favicon.svg" />
    <link rel="apple-touch-icon" href="/pulse2_mobile_product_mockup_v2/apple-touch-icon.png" />
    <link rel="manifest" href="/pulse2_mobile_product_mockup_v2/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" /><!-- the light theme's background token; the boot script below rewrites this per theme -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Theme + background boot — BLOCKING AND INLINE ON PURPOSE.
         This runs before the module script below is even requested, which is
         the whole point: the token set is stamped on <html> before the first
         paint, so there is no flash of the previous theme on reload or on a
         deep link. Moving it into the bundle, deferring it, or making it a
         module would reintroduce that flash.
         `npm run postbuild` copies dist/index.html to dist/404.html, so deep
         links on GitHub Pages get this for free.
         Resolution order: ?theme= (the only way to reach the diagnostic
         `contrast` theme, and a shareable review link on the deployed site),
         then localStorage, then light.
         The four keys and their theme-colors are duplicated from the registry
         in src/theme/index.js. That duplication is deliberate — an inline
         pre-bundle script cannot import — and it is the only copy: keep the
         two in step when adding a theme.
         The key is 'pulse2-v2-theme', NOT 'pulse2-theme' — the v1 engine
         src/context/ThemeContext.jsx already owns that one.

         data-bg IS THE SECOND AXIS, and it is stamped here for a stronger
         reason than the theme is. The ground is the largest painted area in
         the app, so a flash of the wrong one on every reload is worse than a
         flash of the wrong theme — it is the whole screen, not the chrome.
         Its nine keys are the third copy of the list in src/theme/background.js
         and in the `data-bg` block at the foot of src/index.css; the same
         cannot-import rule applies, and all three have to move together.
         It does NOT touch <meta name="theme-color">: that tag colours the
         browser's own chrome, which follows the THEME. The ground re-tints the
         theme's wash and does not redefine it.
         An unrecognised key resolves to the default rather than being written
         through, because an unknown data-bg leaves --bg-layers undeclared,
         and an undeclared var() inside --app-bg is a blank page root. The CSS
         carries a transparent no-op fallback for the same reason. -->
    <script>
      (function () {
        var THEMES = { light: '#f4f6f9', dark: '#09090b', sand: '#ffffff', contrast: '#be00c0' };
        var BACKGROUNDS = {
          wint: 1, solid: 1, horizon: 1, aurora: 1, opal: 1,
          linen: 1, frosted: 1, depth: 1, signal: 1
        };
        var query = null;
        try { query = new URLSearchParams(window.location.search); } catch (e) { /* no URLSearchParams */ }

        function resolve(param, storageKey, allowed, fallback) {
          var fromUrl = query && query.get(param);
          if (fromUrl && allowed[fromUrl]) return fromUrl;
          try {
            var saved = localStorage.getItem(storageKey);
            if (saved && allowed[saved]) return saved;
          } catch (e) { /* localStorage unavailable */ }
          return fallback;
        }

        var key = resolve('theme', 'pulse2-v2-theme', THEMES, 'light');
        var bg = resolve('bg', 'pulse2-v2-bg', BACKGROUNDS, 'wint');

        var root = document.documentElement;
        root.setAttribute('data-theme', key);
        root.setAttribute('data-bg', bg);
        if (key === 'dark') root.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', THEMES[key]);
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <title>Wint Pulse - Mobile App</title>
    <!-- THE HOME SCREEN LABEL, separately. iOS names a web app added to the
         Home Screen after `apple-mobile-web-app-title` when it is present and
         falls back to <title> when it is not — and it truncates that label to
         roughly a dozen characters. Without this line the icon under the
         title above would read "Wint Pulse -…". The tab says the full name;
         the icon says the short one. -->
    <meta name="apple-mobile-web-app-title" content="Wint Pulse" />
    <script type="module" crossorigin src="/pulse2_mobile_product_mockup_v2/assets/index-CiKVDDrU.js"></script>
    <link rel="stylesheet" crossorigin href="/pulse2_mobile_product_mockup_v2/assets/index-Bsd5jjod.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
